[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shape-bayes"
version = "0.1.0"
description = "Closed-form PCA shape posterior from arXiv 2610.09032"
requires-python = ">=3.11"
dependencies = [
  "jax>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
